name: Long-term rolling-origin backtesting

on:
  push:
    branches: [main]
    paths:
      - 'long_term/backtest.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: long-term-backtesting
  cancel-in-progress: false

jobs:
  retrigger:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Wait two hours from this run's start, then dispatch the next backtest
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          sleep 7200
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/backtesting.yml/dispatches" \
            --data '{"ref":"main"}'

  backtest:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Backtest all stocks, windows and horizons
        env:
          LONG_TERM_DATABASE_URL: ${{ secrets.LONG_TERM_DATABASE_URL }}
          LONG_MIN_EXPECTED_NET_RETURN: ${{ vars.LONG_MIN_EXPECTED_NET_RETURN || '0.002' }}
          LONG_ROUND_TRIP_COST: ${{ vars.LONG_ROUND_TRIP_COST || '0.002' }}
        run: python -m long_term.backtest
