name: Long-term weekly stock history

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years of history to request (maximum 10)
        required: true
        default: "5"
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

concurrency:
  group: long-term-weekly-history
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Import weekly history
        env:
          LONG_TERM_DATABASE_URL: ${{ secrets.LONG_TERM_DATABASE_URL }}
          YEARS: ${{ inputs.years || '5' }}
        run: python -m long_term.ingest_weekly --years "$YEARS"
