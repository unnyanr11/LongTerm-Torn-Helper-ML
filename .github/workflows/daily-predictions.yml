name: Long-term daily predictions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: long-term-daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test forecast windows and horizons
        run: python -m unittest discover -s tests -v
      - name: Generate due forecasts
        env:
          LONG_TERM_DATABASE_URL: ${{ secrets.LONG_TERM_DATABASE_URL }}
          LONG_MIN_EXPECTED_NET_RETURN: ${{ vars.LONG_MIN_EXPECTED_NET_RETURN || '0.002' }}
          LONG_ROUND_TRIP_COST: ${{ vars.LONG_ROUND_TRIP_COST || '0.003' }}
        run: python -m long_term.predict_daily

  # GitHub-hosted jobs have a six-hour maximum. Four chained 5h59m30s
  # waits provide a durable ~24-hour relay without keeping the app open.
  wait_1:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: First six-hour relay
        run: sleep 21570

  wait_2:
    needs: wait_1
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Second six-hour relay
        run: sleep 21570

  wait_3:
    needs: wait_2
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Third six-hour relay
        run: sleep 21570

  wait_4:
    needs: wait_3
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Fourth six-hour relay
        run: sleep 21570

  retrigger:
    needs: wait_4
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch the next daily prediction cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/daily-predictions.yml/dispatches" \
            --data '{"ref":"main"}'
