name: Long-term daily predictions

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: long-term-daily-predictions
  cancel-in-progress: false

jobs:
  predict:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test forecast windows and horizons
        run: python -m unittest discover -s tests -v
      - name: Generate due forecasts
        env:
          LONG_TERM_DATABASE_URL: ${{ secrets.LONG_TERM_DATABASE_URL }}
        run: python -m long_term.predict_daily

  retrigger:
    if: github.repository == 'unnyanr11/LongTerm-Torn-Helper-ML' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Wait, then dispatch the next cycle
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # GitHub-hosted jobs have a six-hour maximum. Keep this below that limit.
          # The prediction process itself enforces a 24-hour per-stock database gate.
          sleep 20700
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/workflows/daily-predictions.yml/dispatches" \
            --data '{"ref":"main"}'
