name: Long-term Python tests

on:
  push:
    branches: [main]
    paths:
      - 'long_term/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'long_term/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: long-term-python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile Python modules and tests
        run: python -m compileall -q long_term tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
